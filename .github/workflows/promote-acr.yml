name: Promote Images to Azure Container Registry

# Manual (re-)promotion of already-published GHCR tags to ACR, e.g. to backfill
# a new registry or re-copy a dated tag. Regular publishing promotes
# automatically from build.yml. Copies are registry-to-registry (every
# architecture + attestations) and each image is re-checked by the CIS gate
# first. Auth is OIDC only: see scripts/deploy/azure-bootstrap.sh.

on:
  workflow_dispatch:
    inputs:
      images:
        description: "Space-separated image:tag names, e.g. 'nginx-platform:1.30 alpine-hardened:3.24'"
        type: string
        required: true

permissions:
  contents: read

jobs:
  promote:
    if: ${{ vars.ACR_NAME != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Free-text input: reaches the script through env only (no injection).
      IMAGES: ${{ inputs.images }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install Trivy
        run: ./scripts/install-trivy.sh
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Azure login (OIDC) + ACR login
        run: ./scripts/ci/azure-oidc-login.sh
      - name: Promote
        run: |
          refs=()
          for i in ${IMAGES}; do
            [[ "${i}" =~ ^[a-z0-9._-]+:[A-Za-z0-9._-]+$ ]] || { echo "invalid image name: ${i}" >&2; exit 1; }
            refs+=("ghcr.io/${OWNER,,}/${i}")
          done
          ./scripts/promote-to-acr.sh --verify "${refs[@]}"
