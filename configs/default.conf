server {
    # Unprivileged port so nginx runs as the non-root appuser (CIS — no root,
    # no NET_BIND_SERVICE capability needed).
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    # Security headers are set once in nginx.conf (http block) and merged into
    # every location via `add_header_inherit merge` — don't repeat them here or
    # they will be sent twice.

    # Root directory
    root /app;
    index index.html index.htm;

    # Handle static files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Health check endpoint
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Default location
    location / {
        try_files $uri $uri/ =404;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to backup files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Rate limiting for API endpoints
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        try_files $uri $uri/ =404;
    }

    # Rate limiting for login endpoints
    location /login {
        limit_req zone=login burst=5 nodelay;
        try_files $uri $uri/ =404;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
} 